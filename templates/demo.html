<head>

    <meta content="" name="description">

    <link href="{{ url_for('static',filename='img/favicon.ico') }}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@500;700&display=swap"
        rel="stylesheet">

    <link href="{{ url_for('static',filename='css/bootstrap.min.css') }}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{{ url_for('static',filename='css/style.css') }}" rel="stylesheet">
    <script >
    var images=[null,null,null,null,null];

    function add_image(index){
        const fileInput = document.getElementById('file-input' + index);
        const file = fileInput.files[0]; // get the selected file
        if(file){
            images[index]=file;
        }
    }
    function send_to_server(){
        console.log(images);
        if(images.length!=0){
            const xhr = new XMLHttpRequest();
            const formData = new FormData();
            var index=0;
            for(i=0;i<5;i++){
                if(images[i]){
                    formData.append('image' + index, images[i]);
                    index+=1;
                }
            }
            xhr.open('POST', '/read');
            xhr.onload=()=>{
                console.log(xhr.response);
                var resp=JSON.parse(xhr.response);
                var text="";
                if(resp['license_plate']){// success
                    text=resp['license_plate'];
                }else{// failure
                    text=resp['error'];
                }
                text_field=document.getElementById('license_plate_number');
                text_field.innerText=text;
                console.log(resp);
            }
            xhr.send(formData); // send the form data to the server
        }else{
            console.log("images is empty");
        }
    }



    function submit(){
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0]; // get the selected file
        const image_place=document.getElementById('image_place');

        if(file){
            const xhr = new XMLHttpRequest();
            const formData = new FormData();
            formData.append('image', file);
            xhr.open('POST', '/detect'); // change this to the URL of your server endpoint


            xhr.onload=()=>{
                var resp=JSON.parse(xhr.response);
                bboxes=resp['bboxes'];
                const reader = new FileReader();
                reader.readAsDataURL(file);
                
                reader.onload=function(event){
                    
                    // Set the canvas dimensions to match the image
                    const img=new Image();
                    img.src = event.target.result;
                    img.onload=function(event){
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        
                        // Draw the image on the canvas
                        ctx.drawImage(img, 0, 0);
                        
                        // Draw a red rectangle on top of the image
                        bboxes.forEach(bbox => {
                            ctx.strokeStyle = 'red';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(bbox[0],bbox[1],bbox[2],bbox[3]); 
                        });
                        
                        // Get the resulting image as a data URL
                        const resultDataUrl = canvas.toDataURL();
                        
                        // Display the resulting image in the <img> component
                        image_place.src = resultDataUrl;

                    }
                }
            }
            xhr.send(formData); // send the form data to the server
        }else{
            //handle file null
            console.log("send event");
        }

    }</script>
</head>

<body>

    <!-- Case Start -->
    <div class="container-fluid text-dark bg-light py-5">
        <div class="container py-5">

                </div>

                <div class="col-lg-4 wow fadeIn">

                </div>

                <div class="col-lg-4 wow fadeIn">
                    <span>image2 : </span><input id="file-input2" class="input file" type="file" onchange="{add_image(2)}">

                <div class="col-lg-4 wow fadeIn">
                    <span>image3 : </span><input id="file-input3" class="input file" type="file" onchange="{add_image(3)}">

                <div class="col-lg-4 wow fadeIn">

            </div>
            <!-- submit button -->
            <div class="col-lg-4 wow fadeIn">
                <button class="btn btn-dark" onclick="{send_to_server()}">submit</button>
